[tools]
node = "24.19.0"
pnpm = "11.19.0"

[tasks.install]
run = "pnpm install --frozen-lockfile=false"

[tasks.dev]
run = "pnpm --dir application dev"

[tasks.build]
run = "pnpm --dir application build"

[tasks.lint]
run = "pnpm --dir application lint"

[tasks.format-check]
run = "pnpm --dir application format:check"

[tasks.typecheck]
run = "pnpm --dir application typecheck"

[tasks.test]
run = "pnpm --dir application test"

[tasks.check]
depends = ["lint", "format-check", "typecheck", "test", "build"]
